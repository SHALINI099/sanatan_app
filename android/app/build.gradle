plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.politicalposter.app"

    compileSdk 36
    ndkVersion "28.2.13676358"

    signingConfigs {
        release {
            storeFile file("sanatan.jks")
            storePassword "sanatan@26"
            keyAlias "sanatan"
            keyPassword "sanatan@26"
        }
    }

    packagingOptions {
        // Remove unused native libraries to reduce size
        exclude "lib/x86_64/libxeno_native.so"
        exclude "BUNDLE-METADATA/com.android.tools.build.debugsymbols/x86_64/libxeno_native.so.sym"
        exclude "META-INF/LICENSE"
        exclude "META-INF/NOTICE"
        exclude "META-INF/DEPENDENCIES"
    }
    ext.flutterFFmpegPackage = "min"


    defaultConfig {
        applicationId "com.alnico.sanatanapp"
        minSdkVersion 25
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled false
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    bundle {
        abi {
            enableSplit = true
        }
    }
    buildTypes {
        release {

            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

flutter {
    source '../..'
}
tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:-options"
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // Direct-UPI launch path. Coexists with the standard checkout SDK (pulled in by the
    // razorpay_flutter plugin) ONLY because the root build file pins com.razorpay:standard-core.
    // Without that pin the transitive com.razorpay:core versions skew and the standard sheet
    // dies with NoSuchMethodError: BaseConfig.fetchConfig the instant it opens.
    implementation 'com.razorpay:customui-core:3.10.15'
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "com.google.android.material:material:1.12.0"
    implementation 'phonepe.intentsdk.android.release:IntentSDK:5.2.0'

    // ✅ Facebook SDK
    implementation 'com.facebook.android:facebook-android-sdk:latest.release'
    implementation 'com.facebook.android:facebook-core:latest.release'
    implementation 'com.facebook.android:facebook-marketing:latest.release'
}